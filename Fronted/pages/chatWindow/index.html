<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="left">
        <div class="top">
          <div class="user active">
            <h3>User</h3>
          </div>
          <div class="group">
            <h3>Groups</h3>
          </div>
        </div>
        <div class="bottom"></div>
        <div class="groupBottom"></div>
      </div>
      <div class="chat-container">
        <div class="addmembercontainer">
          <h3>add member</h3>

          <div class="memberbox"></div>
        </div>

        <form action="">
          <input type="text" placeholder="Enter group name.." />
          <button type="button">create group</button>
        </form>

        <header class="chat-header">
          <button class="create-group">Create Group</button>
          <button type="button " class="addmemberbtn">add member</button>
          <h1>------</h1>
        </header>

        <div class="demoImgShow">
          <img
            src="https://plus.unsplash.com/premium_photo-1734549547925-153584e3b1ac?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"
            alt=""
          />
          <button type="button" class="imgSendBtn">send</button>
        </div>

        
        <div class="chat-messages"></div>
        <div class="chat-input">
          <div>
            <input
              class="file"
              hidden
              type="file"
              accept="image/*,video/*,.pdf"
            />
            <button class="send-file">send file</button>
            <input type="text" id="chat" placeholder="Type a message..." />
          </div>
          <button id="send">Send</button>
        </div>
      </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.2.1/axios.min.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
